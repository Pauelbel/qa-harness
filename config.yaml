http:
  # Секунды ожидания ответа, если в вызове не указан свой timeout.
  timeout: 30

  # Максимальное количество символов тела HTTP-ответа, записываемых в лог.
  # Полный объект response при этом не изменяется и не обрезается.
  max_logged_response_body_length: 2000

  # Имена query-параметров, значения которых заменяются на *** в логируемом URL.
  # Сравнение имён выполняется без учёта регистра.
  sensitive_query_parameters:
    - token
    - access_token
    - api_key
    - key
    - password

browser:
  # Движок Playwright: chromium, firefox или webkit.
  engine: chromium

  # true — запуск без видимого окна, false — с окном браузера.
  headless: true

  # Размер viewport в пикселях.
  width: 1920
  height: 1080

  # Разрешает frontend-тестам работать с тестовыми HTTPS-сертификатами.
  ignore_https_errors: true
