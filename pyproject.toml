[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-core"
version = "0.1.0"
description = "Reusable HTTP, PostgreSQL, OData and data-quality test infrastructure"
readme = "README.md"
requires-python = ">=3.11"
# Только то, что нужно любому компоненту: чтение config.yaml и pytest.
dependencies = [
    "pydantic>=2.13",
    "pytest>=8",
    "PyYAML>=6.0",
]

# Каждый компонент ставится отдельным набором: pip install "qa-core[http,excel]".
[project.optional-dependencies]
http = ["requests>=2.34"]
db = ["psycopg2-binary>=2.9"]
excel = ["openpyxl>=3.1", "pandas>=3.0"]
odata = ["pytest-check>=2.9"]
allure = ["allure-pytest>=2.16"]
ui = ["pytest-playwright", "allure-pytest>=2.16"]
vault = ["hvac>=2.0"]

# Готовые сочетания.
backend = ["qa-core[http,db,excel,odata,allure]"]
frontend = ["qa-core[ui]"]
all = ["qa-core[http,db,excel,odata,allure,ui,vault]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qa_core*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "examples"]
python_files = ["test_*.py"]
